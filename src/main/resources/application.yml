server:
  port: 8080

spring:
  application:
    name: exam-system

  # 数据库密码不在这个文件里，放在 application-local.yml（已被 .gitignore 排除）。
  # 加 optional: 是让文件缺失时应用照样能启动，只是连不上库 —— 比压根起不来好排查。
  config:
    import: optional:file:./application-local.yml

  # 用专用账号 exam_app，只对 exam_system 库有权限，不必用 root。建号脚本：sql/00_init_account.sql
  # 这里故意不写 password 字段，密码在 application-local.yml 里
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/exam_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${EXAM_DB_USERNAME:exam_app}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # 项目专用实例，6380，与禅道占用的 6379 隔离。启动：tools/redis/start-redis.bat
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  jackson:
    # 这一项只对 java.util.Date 生效，管不到 LocalDateTime，
    # 后者的格式在 config/JacksonConfig.java 里注册序列化器控制
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期把执行的 SQL 打到控制台，上线要关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 显式指定原生的 EnumTypeHandler，按 name() 存取。
    # 不指定的话 MyBatis-Plus 默认用 MybatisEnumTypeHandler，那要求枚举带 @EnumValue
    # 或实现 IEnum 接口，UserRole 两个都没有
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      id-type: auto
      # 逻辑删除。只对带 deleted 列的表生效，sys_user 没有这一列，走物理删除
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 关掉 Knife4j 增强模式。4.5.0 的 Knife4jOpenApiCustomizer 是按 springdoc 2.3.0 编译的，
# 调用了 2.8.x 中已删除的 getGroupConfigs()，开着会抛 NoSuchMethodError，/v3/api-docs 返回 500。
# 关掉后接口文档由 springdoc 原生的 Swagger UI 提供。
knife4j:
  enable: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

exam:
  jwt:
    # HS256 要求密钥至少 32 字节。优先读环境变量，读不到才用冒号后面的默认值 ——
    # 默认值只为本地开发方便，生产环境必须从环境变量或配置中心注入
    secret: ${EXAM_JWT_SECRET:dev-only-do-not-use-in-production-3f9a7c1e5b2d8046e6a1}
    expire-minutes: 120

  # 两个定时任务：超时自动交卷（扫 ONGOING 且已过 deadline 的）、兜底落库（Redis 同步进 MySQL）
  scheduler:
    # 单批上限，避免某次积压后一次把所有记录捞进内存
    batch-size: 200
    # 启动后延迟一会儿再跑第一次，避开启动瞬间的资源争抢
    initial-delay-ms: 15000
    # 下面两个间隔本地调短了方便观察效果，生产用 30 秒 / 60 秒
    timeout-scan-interval-ms: 8000
    flush-interval-ms: 15000
